<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Idées Géniales</title>
    <link rel="manifest" href="/manifest.json">

    <style>
        /* Le Design (CSS) - INCLUANT LE DÉGRADÉ MAGIQUE */
        body { 
            font-family: sans-serif; 
            /* Dégradé Orange au bas vers Jaune au sommet */
            background: linear-gradient(to top, #ff9933, #ffcc66); 
            display: flex; 
            flex-direction: column; /* Ajout pour bien centrer le contenu */
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .app-container { 
            background: white; 
            padding: 2rem; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 300px; 
        }
        h2 { color: #333; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; }
        
        /* Style des boutons généraux */
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }

        /* Conteneur pour les boutons de gestion (Tri, Nettoyage) */
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }

        /* Style spécifique pour le bouton Trier */
        button.sort-btn { 
            background-color: #ffc107; /* Jaune/Orange */
            color: #333; 
            flex-grow: 1; /* Prend l'espace disponible */
            width: auto; /* Supprime le width: 100% */
            font-size: 14px;
        }
        button.sort-btn:hover { opacity: 0.9; } 

        /* Styles de la liste */
        ul { list-style-type: none; padding: 0; margin-top: 20px; }
        li { background: #fff; border-bottom: 1px solid #eee; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: red; color: white; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 10px; }
        
        /* Style pour le bouton Supprimer les idées terminées (pour un futur ajout) */
        /* Note: Nous n'avons pas la fonction clear-btn complète, mais le style est prêt */
        .clear-btn { background-color: #dc3545; color: white; font-size: 14px; flex-grow: 1; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>💡 Mes Idées</h2>
        <input type="text" id="ideeInput" placeholder="Nouvelle idée...">
        <button onclick="ajouterIdee()">Ajouter</button>
        
        <ul id="listeIdees"></ul>

        <div class="btn-group">
             <button class="clear-btn" onclick="alert('Fonctionnalité en développement !')">Supprimer terminées</button>
             
             <button class="sort-btn" onclick="trierIdees()">Trier (A-Z)</button> 
        </div>
    </div>

    <script>
        // Charger les idées sauvegardées au démarrage
        document.addEventListener('DOMContentLoaded', chargerIdees);

        function ajouterIdee() {
            const input = document.getElementById('ideeInput');
            const texte = input.value;
            
            if (texte === '') return alert("Écrivez quelque chose !");

            creerElementListe(texte);
            sauvegarderEnLocal(texte);
            input.value = ''; // Vider le champ
        }

        function creerElementListe(texte) {
            const li = document.createElement('li');
            li.textContent = texte;
            
            const btn = document.createElement('button');
            btn.textContent = "X";
            btn.className = "delete-btn";
            btn.onclick = function() {
                li.remove();
                supprimerDeLocal(texte);
            };

            li.appendChild(btn);
            document.getElementById('listeIdees').appendChild(li);
        }

        // 💥 NOUVELLE FONCTION DE TRI (A-Z) 💥
        function trierIdees() {
             let idees = JSON.parse(localStorage.getItem('mesIdees')) || [];
             
             // Tri alphabétique insensible à la casse
             idees.sort((a, b) => {
                 const texteA = a.toUpperCase(); 
                 const texteB = b.toUpperCase();
                 if (texteA < texteB) {
                     return -1;
                 }
                 if (texteA > texteB) {
                     return 1;
                 }
                 return 0;
             });

             // Mise à jour de l'affichage
             document.getElementById('listeIdees').innerHTML = '';
             idees.forEach(idee => creerElementListe(idee));
             
             // Ré-enregistrer la liste triée dans le LocalStorage (pour qu'elle soit persistante)
             localStorage.setItem('mesIdees', JSON.stringify(idees));
        }

        // --- Partie Base de données (LocalStorage du navigateur) ---
        function sauvegarderEnLocal(texte) {
            let idees = JSON.parse(localStorage.getItem('mesIdees')) || [];
            idees.push(texte);
            localStorage.setItem('mesIdees', JSON.stringify(idees));
        }

        function chargerIdees() {
            let idees = JSON.parse(localStorage.getItem('mesIdees')) || [];
            idees.forEach(idee => creerElementListe(idee));
        }

        function supprimerDeLocal(texte) {
            let idees = JSON.parse(localStorage.getItem('mesIdees')) || [];
            idees = idees.filter(i => i !== texte);
            localStorage.setItem('mesIdees', JSON.stringify(idees));
        }
    </script>
</body>
</html>
