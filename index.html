<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Idées Géniales</title>
    <link rel="manifest" href="/manifest.json">

    <style>
        /* --- Le Design (CSS) --- */
        body { 
            font-family: sans-serif; 
            /* Dégradé Orange au bas vers Jaune au sommet (La Magie) */
            background: linear-gradient(to top, #ff9933, #ffcc66); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .app-container { 
            background: white; 
            padding: 2rem; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 300px; 
        }
        h2 { color: #333; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; }
        
        /* Style des boutons généraux */
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { opacity: 0.9; }

        /* Conteneur pour les boutons de gestion (Tri, Nettoyage) */
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }

        /* Style spécifique pour les boutons de gestion */
        .clear-btn, .sort-btn { 
            font-size: 14px; 
            flex-grow: 1; 
            width: auto;
        }

        /* Style spécifique pour le bouton Trier */
        button.sort-btn { 
            background-color: #ffc107; 
            color: #333; 
        }
        
        /* Styles de la liste */
        ul { list-style-type: none; padding: 0; margin-top: 20px; }
        /* Rends les éléments de liste cliquables */
        li { 
            background: #fff; 
            border-bottom: 1px solid #eee; 
            padding: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; /* Indique qu'on peut cliquer dessus */
        }
        .delete-btn { background: red; color: white; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 10px; }
        
        /* --- Styles de la Modale (Affichage Détaillé) --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto; 
            background-color: rgba(0,0,0,0.6); 
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto; 
            padding: 20px;
            border: 1px solid #888;
            width: 80%; 
            max-width: 500px;
            border-radius: 8px;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);
        }

        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close-btn:hover,
        .close-btn:focus {
            color: #333;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>💡 Mes Idées</h2>
        <input type="text" id="ideeInput" placeholder="Nouvelle idée...">
        <button onclick="ajouterIdee()">Ajouter</button>
        
        <ul id="listeIdees"></ul>

        <div class="btn-group">
             <button class="clear-btn" onclick="alert('Fonction de nettoyage à implémenter !')">Supprimer terminées</button>
             <button class="sort-btn" onclick="trierIdees()">Trier (A-Z)</button> 
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="fermerDetail()">&times;</span>
            <p id="detailText"></p>
        </div>
    </div>


    <script>
        // Charger les idées sauvegardées au démarrage
        document.addEventListener('DOMContentLoaded', chargerIdees);

        function ajouterIdee() {
            const input = document.getElementById('ideeInput');
            const texte = input.value;
            
            if (texte === '') return alert("Écrivez quelque chose !");

            creerElementListe(texte);
            sauvegarderEnLocal(texte);
            input.value = ''; 
        }

        function creerElementListe(texte) {
            const li = document.createElement('li');
            li.textContent = texte;
            
            // Ouvre la modale au clic
            li.onclick = function() {
                afficherDetail(texte);
            };

            const btn = document.createElement('button');
            btn.textContent = "X";
            btn.className = "delete-btn";
            btn.onclick = function(event) {
                // Arrête la propagation pour que le clic sur X ne déclenche pas l'affichage du détail
                event.stopPropagation(); 
                li.remove();
                supprimerDeLocal(texte);
            };

            li.appendChild(btn);
            document.getElementById('listeIdees').appendChild(li);
        }

        // 💥 FONCTION : Trier les idées par ordre alphabétique (A-Z) 💥
        function trierIdees() {
             let idees = JSON.parse(localStorage.getItem('mesIdees')) || [];
             
             // Tri alphabétique insensible à la casse
             idees.sort((a, b) => {
                 const texteA = a.toUpperCase(); 
                 const texteB = b.toUpperCase();
                 if (texteA < texteB) {
                     return -1;
                 }
                 if (texteA > texteB) {
                     return 1;
                 }
                 return 0;
             });

             // Recharger l'affichage avec la liste triée
             document.getElementById('listeIdees').innerHTML = '';
             idees.forEach(idee => creerElementListe(idee));
             
             // Ré-enregistrer la liste triée dans le LocalStorage
             localStorage.setItem('mesIdees', JSON.stringify(idees));
        }
        
        // 💥 FONCTION : Afficher le Détail dans la Modale 💥
        function afficherDetail(texte) {
            const modal = document.getElementById('detailModal');
            const detailText = document.getElementById('detailText');
            
            detailText.textContent = texte;
            modal.style.display = "block"; // Affiche la modale
        }

        // 💥 FONCTION : Fermer le Détail 💥
        function fermerDetail() {
            const modal = document.getElementById('detailModal');
            modal.style.display = "none"; // Cache la modale
        }

        // 💥 GESTION GLOBALE : Fermer la modale en cliquant en dehors 💥
        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // --- Partie Base de données (LocalStorage) ---
        function sauvegarderEnLocal(texte) {
            let idees = JSON.parse(localStorage.getItem('mesIdees')) || [];
            idees.push(texte);
            localStorage.setItem('mesIdees', JSON.stringify(idees));
        }

        function chargerIdees() {
            let idees = JSON.parse(localStorage.getItem('mesIdees')) || [];
            idees.forEach(idee => creerElementListe(idee));
        }

        function supprimerDeLocal(texte) {
            let idees = JSON.parse(localStorage.getItem('mesIdees')) || [];
            idees = idees.filter(i => i !== texte);
            localStorage.setItem('mesIdees', JSON.stringify(idees));
        }
    </script>
</body>
</html>
